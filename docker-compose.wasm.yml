version: '3.8'

services:
  webrtc-detection-wasm:
    build: .
    ports:
      - "3000:3000"
    environment:
      - MODE=wasm
      - NODE_ENV=production
    volumes:
      - ./models:/app/models
      - ./frontend:/app/frontend
    restart: unless-stopped
    networks:
      - webrtc-network

networks:
  webrtc-network:
    driver: bridge
