<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC Multi-Object Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .mode-indicator {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            margin-top: 10px;
            font-weight: bold;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
            margin-bottom: 30px;
        }

        .video-section {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }

        #remoteVideo {
            width: 100%;
            height: auto;
            display: block;
        }

        .overlay-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .sidebar {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .qr-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .qr-code {
            width: 200px;
            height: 200px;
            margin: 10px auto;
            background: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-code img {
            max-width: 180px;
            max-height: 180px;
        }

        .connection-status {
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .status-disconnected {
            background: #ff4757;
        }

        .status-connecting {
            background: #ffa502;
        }

        .status-connected {
            background: #2ed573;
        }

        .metrics {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .metric-label {
            color: #ccc;
        }

        .metric-value {
            font-weight: bold;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: #3742fa;
            color: white;
        }

        .btn-secondary {
            background: #57606f;
            color: white;
        }

        .btn-danger {
            background: #ff4757;
            color: white;
        }

        .detection-list {
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 10px;
        }

        .detection-item {
            background: rgba(255,255,255,0.1);
            padding: 8px;
            margin-bottom: 5px;
            border-radius: 5px;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.8rem;
            }
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            font-size: 1.2rem;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 WebRTC Object Detection</h1>
            <div class="mode-indicator" id="modeIndicator">
                WASM Mode
            </div>
        </div>

        <div class="main-content">
            <div class="video-section">
                <div class="video-container" id="videoContainer">
                    <div class="loading" id="loadingIndicator">
                        <div class="spinner"></div>
                        Waiting for phone connection...
                    </div>
                    <video id="remoteVideo" autoplay playsinline muted style="display: none;"></video>
                    <canvas id="overlayCanvas" class="overlay-canvas"></canvas>
                </div>
            </div>

            <div class="sidebar">
                <div class="qr-section">
                    <h3>📱 Connect Phone</h3>
                    <p>Scan with camera app or browser:</p>
                    <div class="qr-code" id="qrCode">
                        <div class="loading">
                            <div class="spinner"></div>
                        </div>
                    </div>
                    <div id="connectionUrl" style="font-size: 0.8rem; word-break: break-all; margin-top: 10px;"></div>
                </div>

                <div class="connection-status status-disconnected" id="connectionStatus">
                    📱 Disconnected
                </div>

                <div class="metrics" id="metricsPanel">
                    <h4>📊 Real-time Metrics</h4>
                    <div class="metric-row">
                        <span class="metric-label">Latency:</span>
                        <span class="metric-value" id="latencyMetric">-- ms</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">FPS:</span>
                        <span class="metric-value" id="fpsMetric">-- fps</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Processed:</span>
                        <span class="metric-value" id="processedMetric">-- frames</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Objects:</span>
                        <span class="metric-value" id="objectsMetric">--</span>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn btn-primary" id="benchmarkBtn" onclick="runBenchmark()">
                        🚀 Run Benchmark
                    </button>
                    <button class="btn btn-secondary" id="resetBtn" onclick="resetMetrics()">
                        🔄 Reset Metrics
                    </button>
                    <button class="btn btn-danger" id="downloadBtn" onclick="downloadMetrics()">
                        📊 Download Results
                    </button>
                    <button class="btn btn-secondary" id="performanceBtn" onclick="togglePerformanceChart()">
                        📈 Performance Chart
                    </button>
                </div>

                <!-- Performance Chart -->
                <div id="performanceChart" style="display: none; margin-top: 20px;">
                    <canvas id="latencyChart" width="280" height="150"></canvas>
                </div>

                <div style="margin-top: 20px;">
                    <h4>🎯 Recent Detections</h4>
                    <div class="detection-list" id="detectionList">
                        <div style="color: #999; text-align: center; padding: 20px;">
                            No detections yet
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.16.3/dist/ort.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
