<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Real-time WebRTC object detection using TensorFlow.js COCO-SSD. Stream from phone, detect in browser.">
    <title>WebRTC Object Detection — Desktop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0f0f1a;
            color: #e4e4ef;
            min-height: 100vh;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px;
        }

        /* ── Header ── */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #7c5cfc, #339af0, #51cf66);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-sub {
            margin-top: 8px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 500;
            background: rgba(124,92,252,0.15);
            border: 1px solid rgba(124,92,252,0.25);
        }

        #modelStatus {
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 500;
            background: rgba(51,154,240,0.2);
            border: 1px solid rgba(51,154,240,0.3);
            text-align: center;
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }

        /* ── Layout ── */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 20px;
        }

        /* ── Video ── */
        .video-section {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/9;
        }

        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .overlay-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 14px;
            color: #888;
            font-size: 0.9rem;
        }

        .spinner {
            width: 32px; height: 32px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #7c5cfc;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ── Sidebar ── */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: rgba(255,255,255,0.03);
            border-radius: 14px;
            padding: 18px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .card h3, .card h4 {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ── QR ── */
        .qr-section { text-align: center; }

        .qr-code {
            width: 180px; height: 180px;
            margin: 8px auto;
            background: #fff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .qr-code img { max-width: 170px; max-height: 170px; }

        #connectionUrl {
            font-size: 0.72rem;
            color: #888;
            word-break: break-all;
            margin-top: 8px;
        }

        #roomCode {
            display: inline-block;
            padding: 4px 12px;
            margin-top: 6px;
            background: rgba(124,92,252,0.2);
            border-radius: 6px;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: #b197fc;
        }

        /* ── Connection Status ── */
        .connection-status {
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .status-disconnected { background: rgba(255,71,87,0.2); color: #ff6b6b; border: 1px solid rgba(255,71,87,0.3); }
        .status-connecting { background: rgba(255,165,2,0.15); color: #ffa502; border: 1px solid rgba(255,165,2,0.3); }
        .status-connected { background: rgba(81,207,102,0.15); color: #51cf66; border: 1px solid rgba(81,207,102,0.3); }

        /* ── Metrics ── */
        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
        }

        .metric-row + .metric-row { border-top: 1px solid rgba(255,255,255,0.04); }

        .metric-label { color: #777; font-size: 0.82rem; }
        .metric-value { font-weight: 600; font-size: 0.9rem; color: #51cf66; }

        /* ── Buttons ── */
        .controls { display: flex; flex-direction: column; gap: 8px; }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.82rem;
            transition: all 0.2s ease;
        }

        .btn:hover { transform: translateY(-1px); filter: brightness(1.1); }
        .btn:active { transform: translateY(0); }

        .btn-primary { background: linear-gradient(135deg, #7c5cfc, #5c3fd1); color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.06); color: #ccc; border: 1px solid rgba(255,255,255,0.08); }
        .btn-danger { background: rgba(255,71,87,0.15); color: #ff6b6b; border: 1px solid rgba(255,71,87,0.2); }

        /* ── Detection List ── */
        .detection-list {
            max-height: 180px;
            overflow-y: auto;
        }

        .detection-item {
            background: rgba(81,207,102,0.08);
            padding: 8px 12px;
            margin-bottom: 4px;
            border-radius: 8px;
            font-size: 0.82rem;
            border-left: 3px solid #51cf66;
        }

        /* ── Chart ── */
        #performanceChart {
            margin-top: 12px;
            border-radius: 10px;
            overflow: hidden;
            background: rgba(0,0,0,0.3);
        }

        #latencyChart {
            display: block;
            width: 100%;
        }

        /* ── Responsive ── */
        @media (max-width: 860px) {
            .main-content { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 WebRTC Object Detection</h1>
            <div class="header-sub">
                <span class="badge">🧠 TensorFlow.js COCO-SSD</span>
                <span class="badge">🔒 Local Processing</span>
            </div>
        </div>

        <div id="modelStatus" style="display: none;">🧠 Loading AI model...</div>

        <div class="main-content">
            <div class="video-section">
                <div class="video-container" id="videoContainer">
                    <div class="loading" id="loadingIndicator">
                        <div class="spinner"></div>
                        Waiting for phone connection...
                    </div>
                    <video id="remoteVideo" autoplay playsinline muted style="display: none;"></video>
                    <canvas id="overlayCanvas" class="overlay-canvas"></canvas>
                </div>
            </div>

            <div class="sidebar">
                <!-- QR Code -->
                <div class="card qr-section">
                    <h3>📱 Connect Phone</h3>
                    <p style="font-size: 0.78rem; color: #888; margin-bottom: 8px;">Scan with your phone's camera</p>
                    <div class="qr-code" id="qrCode">
                        <div class="spinner"></div>
                    </div>
                    <div id="roomCode"></div>
                    <div id="connectionUrl"></div>
                </div>

                <!-- Connection Status -->
                <div class="connection-status status-disconnected" id="connectionStatus">
                    📱 Disconnected
                </div>

                <!-- Metrics -->
                <div class="card">
                    <h4>📊 Live Metrics</h4>
                    <div class="metric-row">
                        <span class="metric-label">Latency</span>
                        <span class="metric-value" id="latencyMetric">—</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">FPS</span>
                        <span class="metric-value" id="fpsMetric">—</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Processed</span>
                        <span class="metric-value" id="processedMetric">—</span>
                    </div>
                    <div class="metric-row">
                        <span class="metric-label">Objects</span>
                        <span class="metric-value" id="objectsMetric">—</span>
                    </div>
                </div>

                <!-- Controls -->
                <div class="controls">
                    <button class="btn btn-primary" id="benchmarkBtn" onclick="runBenchmark()">🚀 Run Benchmark</button>
                    <button class="btn btn-secondary" id="resetBtn" onclick="resetMetrics()">🔄 Reset Metrics</button>
                    <button class="btn btn-danger" id="downloadBtn" onclick="downloadMetrics()">📊 Download Results</button>
                    <button class="btn btn-secondary" id="performanceBtn" onclick="togglePerformanceChart()">📈 Performance Chart</button>
                </div>

                <!-- Chart -->
                <div id="performanceChart" style="display: none;">
                    <canvas id="latencyChart" width="280" height="140"></canvas>
                </div>

                <!-- Detections -->
                <div class="card">
                    <h4>🎯 Recent Detections</h4>
                    <div class="detection-list" id="detectionList">
                        <div style="color: #666; text-align: center; padding: 16px; font-size: 0.82rem;">
                            No detections yet
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- TensorFlow.js + COCO-SSD from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

    <!-- Socket.IO (served by server) -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- App -->
    <script src="js/yolo-detector.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
