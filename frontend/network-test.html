<!DOCTYPE html>
<html>
<head>
    <title>Network Test Page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial; padding: 20px; background: #2c3e50; color: white; }
        .success { color: #27ae60; font-size: 24px; }
        .info { background: #34495e; padding: 15px; border-radius: 8px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1 class="success">✅ Network Connection SUCCESS!</h1>
    <div class="info">
        <h3>Connection Details:</h3>
        <p><strong>Server IP:</strong> localhost</p>
        <p><strong>Port:</strong> 3000</p>
        <p><strong>Your IP:</strong> <span id="clientIP">Loading...</span></p>
        <p><strong>Time:</strong> <span id="timestamp"></span></p>
    </div>
    
    <div class="info">
        <h3>Next Steps:</h3>
        <p>🎯 <a href="/phone" style="color: #3498db;">Click here to access the Phone Camera</a></p>
        <p>📱 Or go to: <strong>http://localhost:3000/phone</strong></p>
    </div>
    
    <script>
        document.getElementById('timestamp').textContent = new Date().toLocaleString();
        
        // Try to get client IP
        fetch('/api/client-info')
            .then(r => r.json())
            .then(data => {
                document.getElementById('clientIP').textContent = data.ip || 'Unknown';
            })
            .catch(() => {
                document.getElementById('clientIP').textContent = 'Cannot detect';
            });
    </script>
</body>
</html>
