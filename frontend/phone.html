<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mobile camera streaming and real-time object detection via WebRTC">
  <title>Mobile Camera — WebRTC Vision</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent-purple: #7c5cfc;
      --accent-blue: #339af0;
      --accent-green: #51cf66;
      --accent-red: #ff6b6b;
      --accent-amber: #fcc419;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #000;
      color: #fff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      touch-action: manipulation;
    }

    .app-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #000;
    }

    /* ── Permission Screen ── */
    .permission-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(165deg, #18122B, #0c0d14, #08111e);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 32px;
      z-index: 100;
    }

    .perm-icon {
      font-size: 3.8rem;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .perm-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .perm-desc {
      font-size: 0.95rem;
      color: #a0aec0;
      margin-bottom: 28px;
      line-height: 1.5;
      max-width: 320px;
    }

    .start-btn {
      padding: 14px 36px;
      border: none;
      border-radius: 16px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      color: #fff;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(124, 92, 252, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .start-btn:active {
      transform: scale(0.96);
    }

    .error-card {
      background: rgba(255, 107, 107, 0.15);
      border: 1px solid rgba(255, 107, 107, 0.35);
      border-radius: 12px;
      padding: 14px 20px;
      color: var(--accent-red);
      font-size: 0.88rem;
      margin-top: 20px;
      max-width: 320px;
      display: none;
    }

    /* ── Camera Container ── */
    .video-container {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: none;
    }

    #localVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: none;
      transition: transform 0.3s ease;
    }

    .mirrored {
      transform: scaleX(-1) !important;
    }

    .overlay-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* ── Top HUD (Status & Metrics) ── */
    .top-hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 20;
      pointer-events: none;
    }

    .hud-pill {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: auto;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-red);
    }

    .dot-connected { background: var(--accent-green); }
    .dot-connecting { background: var(--accent-amber); }

    .metrics-pill {
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.72rem;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 105px;
    }

    .metrics-item {
      display: flex;
      justify-content: space-between;
    }

    .metrics-label { color: #a0aec0; }
    .metrics-val { color: var(--accent-green); font-weight: 700; }

    /* ── Bottom Controls ── */
    .controls-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.3), transparent);
      display: none;
      justify-content: center;
      gap: 16px;
      z-index: 20;
    }

    .control-btn {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 12px 20px;
      border-radius: 24px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, transform 0.15s;
    }

    .control-btn:active {
      transform: scale(0.94);
    }

    .control-btn.active {
      background: var(--accent-purple);
      border-color: var(--accent-purple);
    }

    @media (prefers-reduced-motion: reduce) {
      .perm-icon { animation: none; }
      .start-btn, .control-btn { transition: none; }
    }
  </style>
</head>
<body>
  <div class="app-viewport">
    <!-- Camera Permission Screen -->
    <div class="permission-overlay" id="permOverlay">
      <div class="perm-icon" aria-hidden="true">📹</div>
      <h1 class="perm-title">Wireless Camera</h1>
      <p class="perm-desc">
        Stream your mobile camera in real-time to the desktop AI object detector over secure P2P WebRTC.
      </p>
      <button class="start-btn" id="startBtn">📱 Start Camera</button>
      <div class="error-card" id="errorCard" role="alert" aria-live="assertive"></div>
    </div>

    <!-- Active Camera Viewport -->
    <div class="video-container" id="videoWrapper">
      <video id="localVideo" autoplay playsinline muted></video>
      <canvas id="overlayCanvas" class="overlay-canvas"></canvas>

      <!-- Top HUD -->
      <div class="top-hud">
        <div class="hud-pill" id="statusPillContainer" role="status" aria-live="polite">
          <div class="dot" id="statusDot"></div>
          <span id="statusText">Connecting...</span>
        </div>

        <div class="metrics-pill" aria-label="Streaming Performance Metrics">
          <div class="metrics-item">
            <span class="metrics-label">FPS:</span>
            <span class="metrics-val" id="fpsDisplay">—</span>
          </div>
          <div class="metrics-item">
            <span class="metrics-label">Latency:</span>
            <span class="metrics-val" id="latencyDisplay">—</span>
          </div>
          <div class="metrics-item">
            <span class="metrics-label">Objects:</span>
            <span class="metrics-val" id="objectsDisplay">0</span>
          </div>
        </div>
      </div>

      <!-- Bottom Controls -->
      <div class="controls-panel" id="controlsPanel">
        <button class="control-btn" id="flipBtn" aria-label="Flip Camera front or back">🔄 Flip</button>
        <button class="control-btn" id="qualityBtn" aria-label="Toggle HD or SD Resolution" aria-pressed="false">📺 HD</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
  <script src="js/core/common.js"></script>
  <script src="js/detector.js"></script>
  <script src="js/phone.js"></script>
</body>
</html>
