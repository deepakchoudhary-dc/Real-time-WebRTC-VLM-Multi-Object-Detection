version: '3.8'

services:
  webrtc-detection:
    build: .
    ports:
      - "3443:3443"
      - "3000:3000"
    environment:
      - PORT=3443
      - HTTP_PORT=3000
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - webrtc-network

networks:
  webrtc-network:
    driver: bridge
